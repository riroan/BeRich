# Least-privilege identity for the GitHub Deploy workflow: it can change the
# berich deployment's image and watch the rollout, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["berich"]
    verbs: ["get", "patch", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
subjects:
  - kind: ServiceAccount
    name: github-deployer
---
# Long-lived token for the kubeconfig (see README.md)
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
